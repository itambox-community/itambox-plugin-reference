name: Plugin CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_DB: itambox
          POSTGRES_USER: itambox
          POSTGRES_PASSWORD: itambox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itambox -d itambox"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ITAMBOX_HOST_REF: b82f4580e5cd9ad0ed0f28abb769d48d183bf1f3
      ITAMBOX_ENV: dev
      ITAMBOX_PLUGINS: itambox_plugin_reference
      ITAMBOX_PLUGINS_CONFIG: '{"itambox_plugin_reference":{"display_label":"Plugin CI"}}'
      ITAMBOX_DB_HOST: 127.0.0.1
      ITAMBOX_DB_PORT: "5432"
      ITAMBOX_DB_NAME: itambox
      ITAMBOX_DB_USER: itambox
      ITAMBOX_DB_PASSWORD: itambox
      ITAMBOX_DB_SSLMODE: disable
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.31
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check out pinned host source
        run: |
          git init .ci/itambox-webapp
          git -C .ci/itambox-webapp remote add origin https://github.com/itambox-community/itambox-webapp.git
          git -C .ci/itambox-webapp fetch --depth 1 origin "$ITAMBOX_HOST_REF"
          git -C .ci/itambox-webapp checkout --detach FETCH_HEAD
          test "$(git -C .ci/itambox-webapp rev-parse HEAD)" = "$ITAMBOX_HOST_REF"

      - name: Check lock and build distributions
        run: |
          uv lock --check
          uv build --out-dir dist

      - name: Install host build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential libldap2-dev libsasl2-dev libssl-dev

      - name: Install host dependencies and plugin wheel
        run: |
          uv sync --project .ci/itambox-webapp --locked --group dev
          uv pip install --python .ci/itambox-webapp/.venv/bin/python dist/*.whl

      - name: Run host plugin verification tests
        env:
          PYTHONPATH: .ci/itambox-webapp/itambox
        run: >-
          uv run --project .ci/itambox-webapp --locked --no-sync
          pytest -c .ci/itambox-webapp/pyproject.toml tests -q

      - name: Lint plugin templates
        run: >-
          uv run --project .ci/itambox-webapp --locked --no-sync
          djlint src/itambox_plugin_reference/templates --check --lint
