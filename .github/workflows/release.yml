name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.31

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(python -c 'import ast; from pathlib import Path; module = ast.parse(Path("src/itambox_plugin_reference/__init__.py").read_text()); print(next(node.value.value for node in module.body if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)))')"
          test -n "$VERSION"
          test "$RELEASE_TAG" = "v$VERSION"

      - name: Build wheel and source distribution
        run: uv build --out-dir dist

      - name: Create GitHub Release and attach distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Reference plugin $GITHUB_REF_NAME" \
              --generate-notes
          fi
